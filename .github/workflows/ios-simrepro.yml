name: iOS Sim Crash Repro

# Device-free reproduction of the 2.1(a) "app closed on start" crash.
# Runs the app in the iOS Simulator with simulation mode on so it auto-drives
# into a run, and captures the RoboVM console — an uncaught exception prints its
# full stack trace there, which is what we need to fix the crash.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim-repro:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
      IOS_SKIP_SIGNING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable simulation auto-play in the launcher (repro only)
        run: |
          set -euo pipefail
          F=ios/src/main/kotlin/com/luminadigitale/fluxcore/ios/IosLauncher.kt
          sed -i '' 's/            FluxCoreGame(/            FluxCoreGame(\n                autoExitSeconds = 45f,/' "$F"
          sed -i '' 's/                        adsEnabled = false,/                        adsEnabled = false,\n                        simulationModeEnabled = true,\n                        simulationStartLevel = 0,/' "$F"
          echo "----- patched launcher -----"
          cat "$F"

      - name: List available simulators and RoboVM tasks
        run: |
          xcrun simctl list devices available | grep -i ipad || true
          echo "----- robovm/ios launch tasks -----"
          ./gradlew --no-daemon :ios:tasks --all 2>/dev/null | grep -iE "launch|simulator|robovm" || true

      - name: Build and launch in the iPad simulator
        run: |
          set -uo pipefail
          # RoboVM's launch task builds+installs+launches then DETACHES the console,
          # so it only shows the first init log line. We capture the real runtime
          # (including any crash) from the simulator's own log afterwards.
          ( ./gradlew --no-daemon --no-configuration-cache --stacktrace \
              :ios:launchIPadSimulator 2>&1 | tee sim-console.log ) &
          GPID=$!
          ( sleep 1500; kill -9 $GPID 2>/dev/null ) &
          WPID=$!
          wait $GPID || true
          kill $WPID 2>/dev/null || true
          echo "===== letting the app run / crash ====="
          sleep 20

      - name: Capture simulator log and crash report
        if: always()
        run: |
          set +e
          xcrun simctl spawn booted log show --last 5m --style compact \
            --predicate 'process == "FluxCore"' 2>/dev/null > full.log
          echo "===== total FluxCore log lines: $(wc -l < full.log) ====="
          echo
          echo "===== is the app still alive? (clean=alive after autoExit, crash=gone early) ====="
          xcrun simctl spawn booted launchctl list 2>/dev/null | grep -i flux || echo "(FluxCore not in launchctl list)"
          echo
          echo "===== app-relevant lines (system noise removed), last 200 ====="
          grep -avE "coreaudio|com\.apple\.UIKit|com\.apple\.xpc|BackgroundTask|PointerLock|AudioSession|RemoteIO|AQME|Workgroup|SpatialMixer|AudioConverter|assertion|Storefront|SKProductsRequest|storekit" full.log \
            | tee applog.txt | tail -200
          echo
          echo "===== error / fault / exception / crash lines ====="
          grep -aiE "exception|\[error\]|fault|robovm|abort|signal|terminat|uncaught|fatal|EXC_|SIGSEGV|SIGABRT|NullPointer|IndexOutOfBounds|IllegalState|UnsatisfiedLink|NoClassDefFound|ClassNotFound|glGetError|GL_INVALID" full.log \
            | grep -aviE "coreaudio|AudioConverter" | tee errlines.txt | head -120
          [ -s errlines.txt ] || echo "(no error/exception lines)"
          echo
          echo "===== crash reports (.ips / .crash) ====="
          CR=$(find "$HOME/Library/Logs/DiagnosticReports" \
                    "$HOME/Library/Developer/CoreSimulator" \
                    /Library/Logs/DiagnosticReports \
                    -iname 'FluxCore*' 2>/dev/null)
          if [ -z "$CR" ]; then
            echo "(no FluxCore crash report found)"
          else
            for f in $CR; do echo "----------- $f -----------"; cat "$f"; echo; done | tee crash.txt
          fi

      - name: Upload full console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-console
          path: |
            sim-console.log
            full.log
            applog.txt
            errlines.txt
            crash.txt
