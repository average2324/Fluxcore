name: iOS Build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-release.yml"
      - "assets/**"
      - "core/**"
      - "ios/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload the signed IPA to TestFlight"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
      ORBITFLUX_IOS_PREMIUM_PRODUCT_ID: ${{ secrets.ORBITFLUX_IOS_PREMIUM_PRODUCT_ID }}
      IOS_SKIP_SIGNING: ${{ secrets.IOS_SKIP_SIGNING }}
      IOS_SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
      IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      # Falls back to a fixed string so a missing secret cannot create a passwordless
      # keychain. The keychain is created in RUNNER_TEMP and dies with the runner.
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD || 'fluxcore-ephemeral-ci-keychain' }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show release mode
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "upload_testflight=${{ inputs.upload_testflight || 'push' }}"
          echo "IOS_SKIP_SIGNING=${IOS_SKIP_SIGNING:-unset}"
          echo "### iOS release mode" >> "$GITHUB_STEP_SUMMARY"
          echo "- event_name: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- upload_testflight: ${{ inputs.upload_testflight || 'push' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- IOS_SKIP_SIGNING: ${IOS_SKIP_SIGNING:-unset}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify shared code and iOS launcher
        run: ./gradlew --no-daemon --no-configuration-cache --stacktrace :core:test :ios:compileKotlin

      - name: Import signing assets
        if: ${{ env.IOS_DISTRIBUTION_CERTIFICATE_BASE64 != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/FluxCore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/fluxcore-signing.keychain-db"

          echo "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Build signed IPA
        if: ${{ env.IOS_SKIP_SIGNING == 'false' }}
        run: ./gradlew --no-daemon --no-configuration-cache --stacktrace :ios:createIPA

      - name: Upload IPA artifact
        if: ${{ env.IOS_SKIP_SIGNING == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/robovm/**/*.ipa

      - name: Upload to TestFlight
        if: ${{ (github.event_name == 'push' || inputs.upload_testflight == 'true') && env.IOS_SKIP_SIGNING == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH="$(find ios/build/robovm -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA file found under ios/build/robovm." >&2
            exit 1
          fi
          if [ -z "${APP_STORE_CONNECT_KEY_ID:-}" ] || [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            echo "App Store Connect API key id or issuer id secret is missing." >&2
            exit 1
          fi
          if [ -z "${APP_STORE_CONNECT_API_KEY_P8_BASE64:-}" ] && [ -z "${APP_STORE_CONNECT_API_KEY_P8:-}" ]; then
            echo "App Store Connect API key secret is missing." >&2
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          if [ -n "${APP_STORE_CONNECT_API_KEY_P8_BASE64:-}" ]; then
            printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 -D > "$KEY_PATH"
          else
            printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_PATH"
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Uploaded $IPA_PATH to App Store Connect. Processing can take several minutes." >> "$GITHUB_STEP_SUMMARY"
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
